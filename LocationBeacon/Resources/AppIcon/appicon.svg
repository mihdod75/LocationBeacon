<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="456" height="456" fill="#1e3a8a" />

    <!-- Beacon/Lighthouse Tower -->
    <rect x="190" y="180" width="76" height="160" fill="#fbbf24" rx="4" />

    <!-- Beacon Tower Stripes -->
    <rect x="190" y="180" width="76" height="12" fill="#f59e0b" />
    <rect x="190" y="210" width="76" height="12" fill="#f59e0b" />
    <rect x="190" y="240" width="76" height="12" fill="#f59e0b" />

    <!-- Beacon Light (top) -->
    <circle cx="228" cy="170" r="24" fill="#ef4444" />
    <circle cx="228" cy="170" r="18" fill="#fca5a5" opacity="0.8" />

    <!-- Radio Waves (animated effect with circles) -->
    <circle cx="228" cy="228" r="50" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.6" />
    <circle cx="228" cy="228" r="70" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4" />
    <circle cx="228" cy="228" r="90" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.2" />

    <!-- Base -->
    <rect x="180" y="340" width="96" height="20" fill="#78350f" rx="2" />
    <polygon points="160,360 296,360 280,380 176,380" fill="#92400e" />
</svg>